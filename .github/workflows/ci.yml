name: CI — SaaS Financial Reporter

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ── Job 1: Unit Test Matrix (Python 3.9 → 3.10 → 3.11 → 3.12) ────────────
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: pytest -v --tb=short

  # ── Job 2: End-to-End Pipeline Validation (Python 3.12) ───────────────────
  pipeline:
    name: End-to-End Pipeline Validation (Python 3.12)
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p charts reports models

      - name: Run full reporting pipeline
        env:
          MPLBACKEND: Agg
        run: python main.py

      - name: Upload generated charts
        uses: actions/upload-artifact@v4
        with:
          name: financial-charts
          path: charts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: financial-report-pdf
          path: reports/
          if-no-files-found: warn
          retention-days: 30
